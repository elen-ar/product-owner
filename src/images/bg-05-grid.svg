<svg viewBox="0 0 480 200" xmlns="http://www.w3.org/2000/svg" width="480" height="200">
  <defs>
    <linearGradient id="g-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#083344"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </linearGradient>
    <radialGradient id="g-heat" cx="62%" cy="42%" r="45%">
      <stop offset="0%"   stop-color="#14b8a6" stop-opacity="0.35"/>
      <stop offset="50%"  stop-color="#0d9488" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#042f2e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="g-grid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0 L0 0 0 32" fill="none" stroke="#2dd4bf" stroke-width="0.4" stroke-opacity="0.18"/>
    </pattern>
    <filter id="g-glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="480" height="200" fill="url(#g-bg)"/>
  <rect width="480" height="200" fill="url(#g-grid)"/>
  <rect width="480" height="200" fill="url(#g-heat)"/>
  <!-- bar chart hint -->
  <rect x="30"  y="136" width="14" height="24" fill="#0d9488" fill-opacity="0.20" rx="1"/>
  <rect x="52"  y="120" width="14" height="40" fill="#0d9488" fill-opacity="0.24" rx="1"/>
  <rect x="74"  y="128" width="14" height="32" fill="#0d9488" fill-opacity="0.28" rx="1"/>
  <rect x="96"  y="108" width="14" height="52" fill="#0d9488" fill-opacity="0.32" rx="1"/>
  <rect x="118" y="124" width="14" height="36" fill="#0d9488" fill-opacity="0.36" rx="1"/>
  <rect x="140" y="116" width="14" height="44" fill="#0d9488" fill-opacity="0.40" rx="1"/>
  <!-- focal dots -->
  <circle cx="298" cy="84" r="6"   fill="#2dd4bf" opacity="1.0" filter="url(#g-glow)"/>
  <circle cx="320" cy="72" r="3.5" fill="#5eead4" opacity="0.8" filter="url(#g-glow)"/>
  <circle cx="278" cy="96" r="3"   fill="#5eead4" opacity="0.7" filter="url(#g-glow)"/>
  <circle cx="310" cy="100" r="2.5" fill="#99f6e4" opacity="0.6" filter="url(#g-glow)"/>
  <circle cx="340" cy="80"  r="2"   fill="#99f6e4" opacity="0.5" filter="url(#g-glow)"/>
</svg>
