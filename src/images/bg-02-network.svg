<svg viewBox="0 0 480 200" xmlns="http://www.w3.org/2000/svg" width="480" height="200">
  <defs>
    <linearGradient id="n-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#083344"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <radialGradient id="n-glow" cx="55%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#0891b2" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#083344" stop-opacity="0"/>
    </radialGradient>
    <filter id="n-blur">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="480" height="200" fill="url(#n-bg)"/>
  <rect width="480" height="200" fill="url(#n-glow)"/>
  <!-- edges -->
  <line x1="80"  y1="50"  x2="200" y2="30"  stroke="#22d3ee" stroke-opacity="0.25" stroke-width="1"/>
  <line x1="200" y1="30"  x2="340" y2="70"  stroke="#22d3ee" stroke-opacity="0.25" stroke-width="1"/>
  <line x1="340" y1="70"  x2="420" y2="40"  stroke="#22d3ee" stroke-opacity="0.25" stroke-width="1"/>
  <line x1="80"  y1="50"  x2="130" y2="120" stroke="#22d3ee" stroke-opacity="0.25" stroke-width="1"/>
  <line x1="200" y1="30"  x2="260" y2="100" stroke="#22d3ee" stroke-opacity="0.8"  stroke-width="1.5" filter="url(#n-blur)"/>
  <line x1="340" y1="70"  x2="380" y2="140" stroke="#22d3ee" stroke-opacity="0.25" stroke-width="1"/>
  <line x1="420" y1="40"  x2="380" y2="140" stroke="#22d3ee" stroke-opacity="0.25" stroke-width="1"/>
  <line x1="130" y1="120" x2="60"  y2="170" stroke="#22d3ee" stroke-opacity="0.25" stroke-width="1"/>
  <line x1="130" y1="120" x2="200" y2="160" stroke="#22d3ee" stroke-opacity="0.25" stroke-width="1"/>
  <line x1="260" y1="100" x2="200" y2="160" stroke="#22d3ee" stroke-opacity="0.25" stroke-width="1"/>
  <line x1="260" y1="100" x2="310" y2="170" stroke="#22d3ee" stroke-opacity="0.25" stroke-width="1"/>
  <line x1="380" y1="140" x2="310" y2="170" stroke="#22d3ee" stroke-opacity="0.25" stroke-width="1"/>
  <line x1="380" y1="140" x2="440" y2="160" stroke="#22d3ee" stroke-opacity="0.25" stroke-width="1"/>
  <line x1="60"  y1="170" x2="200" y2="160" stroke="#22d3ee" stroke-opacity="0.25" stroke-width="1"/>
  <line x1="200" y1="160" x2="310" y2="170" stroke="#22d3ee" stroke-opacity="0.25" stroke-width="1"/>
  <line x1="310" y1="170" x2="440" y2="160" stroke="#22d3ee" stroke-opacity="0.25" stroke-width="1"/>
  <!-- nodes -->
  <circle cx="80"  cy="50"  r="3.5" fill="#67e8f9" opacity="0.7" filter="url(#n-blur)"/>
  <circle cx="200" cy="30"  r="3.5" fill="#67e8f9" opacity="0.7" filter="url(#n-blur)"/>
  <circle cx="340" cy="70"  r="3.5" fill="#67e8f9" opacity="0.7" filter="url(#n-blur)"/>
  <circle cx="420" cy="40"  r="3.5" fill="#67e8f9" opacity="0.7" filter="url(#n-blur)"/>
  <circle cx="130" cy="120" r="3.5" fill="#67e8f9" opacity="0.7" filter="url(#n-blur)"/>
  <circle cx="260" cy="100" r="6"   fill="#22d3ee" opacity="1.0" filter="url(#n-blur)"/>
  <circle cx="380" cy="140" r="3.5" fill="#67e8f9" opacity="0.7" filter="url(#n-blur)"/>
  <circle cx="60"  cy="170" r="3.5" fill="#67e8f9" opacity="0.7" filter="url(#n-blur)"/>
  <circle cx="200" cy="160" r="3.5" fill="#67e8f9" opacity="0.7" filter="url(#n-blur)"/>
  <circle cx="310" cy="170" r="3.5" fill="#67e8f9" opacity="0.7" filter="url(#n-blur)"/>
  <circle cx="440" cy="160" r="3.5" fill="#67e8f9" opacity="0.7" filter="url(#n-blur)"/>
</svg>
