  </defs>
  <rect width="480" height="200" fill="url(#p-bg)"/>
  <path d="M0,100 C30,100 30,60 60,60 S90,100 120,100 S150,60 180,60 S210,100 240,100 S270,60 300,60 S330,100 360,100 S390,60 420,60 S450,100 480,100"
