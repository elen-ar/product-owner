  <line x1="0" y1="40"  x2="480" y2="40"  stroke="#2dd4bf" stroke-opacity="0.06" stroke-width="1"/>
  <line x1="0" y1="80"  x2="480" y2="80"  stroke="#2dd4bf" stroke-opacity="0.06" stroke-width="1"/>
